<div id="dino-arch-container" style="position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; font-family: 'Google Sans', 'Open Sans', sans-serif; padding: 1rem; background-color: var(--card-bg, #ffffff); color: var(--text-color, #1B1C1D); border-radius: 12px; border: 1px solid var(--main-border-color, #C4C7C5); margin: 1.5rem 0;">
  <svg style="position: absolute; width: 0; height: 0;">
    <defs>
      <marker id="dino-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#C4C7C5" />
      </marker>
    </defs>
  </svg>

  <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding: 0 0.5rem;">
    <span style="margin: 0; font-size: 1rem; font-weight: 600; color: var(--heading-color, #575B5F);">DINOv2 Architecture &amp; Data Flow</span>
    <div style="display: flex; gap: 1rem; font-size: 0.875rem;">
      <div style="display: flex; align-items: center; gap: 0.5rem;"><div style="width: 10px; height: 10px; border-radius: 50%; background: #1A73E8;"></div> Student</div>
      <div style="display: flex; align-items: center; gap: 0.5rem;"><div style="width: 10px; height: 10px; border-radius: 50%; background: #FA903E;"></div> Teacher</div>
      <div style="display: flex; align-items: center; gap: 0.5rem;"><div style="width: 10px; height: 10px; border-radius: 50%; background: #D93025;"></div> Loss</div>
    </div>
  </div>

  <div id="dino-diagram-area" style="position: relative; width: 100%; aspect-ratio: 16/9; background-color: var(--main-bg, #ffffff); border-radius: 12px; overflow: hidden; border: 1px solid var(--main-border-color, #eaeaea);">
    <svg id="dino-connections" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;"></svg>

    <div id="node-input" style="position: absolute; top: 40%; left: 5%; width: 12%; height: 20%; border: 2px solid #C4C7C5; background-color: #ffffff; color: #1B1C1D; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 10;">
      <div style="font-size: 1.25rem;">🖼️</div>
      <div style="font-size: 0.75rem; font-weight: bold; margin-top: 2px;">Input</div>
      <div style="font-size: 0.65rem; opacity: 0.8;">Crops</div>
    </div>

    <div id="node-student" style="position: absolute; top: 10%; left: 30%; width: 18%; height: 25%; border: 2px solid #1A73E8; background-color: #e8f0fe; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 10;">
      <div style="font-size: 0.75rem; font-weight: bold; color: #1A73E8;">Student</div>
      <div style="font-size: 0.65rem; opacity: 0.8; color: #1A73E8;">ViT Encoder</div>
      <div style="margin-top: 4px; font-size: 0.6rem; background-color: #1A73E8; color: white; padding: 2px 6px; border-radius: 999px;">Backprop</div>
    </div>

    <div id="node-teacher" style="position: absolute; top: 65%; left: 30%; width: 18%; height: 25%; border: 2px solid #FA903E; background-color: #fff3e0; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 10;">
      <div style="font-size: 0.75rem; font-weight: bold; color: #FA903E;">Teacher</div>
      <div style="font-size: 0.65rem; opacity: 0.8; color: #FA903E;">ViT Encoder</div>
      <div style="margin-top: 4px; font-size: 0.6rem; background-color: #FA903E; color: white; padding: 2px 6px; border-radius: 999px;">Stop Grad</div>
    </div>

    <div style="position: absolute; left: 55%; top: 10%; bottom: 10%; border-right: 1px dashed #C4C7C5;"></div>
    <div style="position: absolute; left: 56%; top: 5%; font-size: 0.7rem; color: #777; transform: rotate(90deg); transform-origin: left;">Projection Heads</div>

    <div id="node-koleo" style="position: absolute; top: 5%; left: 79%; width: 16%; height: 18%; border: 2px solid #D93025; background-color: #fce8e6; color: #1B1C1D; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 10;">
      <div style="font-size: 0.75rem; font-weight: bold; color: #D93025;">KoLeo Reg</div>
      <div style="font-size: 0.65rem; opacity: 0.8;">Entropy</div>
    </div>

    <div id="node-dino" style="position: absolute; top: 40%; left: 79%; width: 16%; height: 20%; border: 2px solid #D93025; background-color: #fce8e6; color: #1B1C1D; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 10;">
      <div style="font-size: 0.75rem; font-weight: bold; color: #D93025;">DINO Loss</div>
      <div style="font-size: 0.65rem; opacity: 0.8;">Global</div>
    </div>

    <div id="node-ibot" style="position: absolute; top: 75%; left: 79%; width: 16%; height: 20%; border: 2px solid #D93025; background-color: #fce8e6; color: #1B1C1D; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 10;">
      <div style="font-size: 0.75rem; font-weight: bold; color: #D93025;">iBOT Loss</div>
      <div style="font-size: 0.65rem; opacity: 0.8;">Local/MIM</div>
    </div>

    <div style="position: absolute; left: 39%; top: 50%; transform: translate(-50%, -50%); font-size: 0.6rem; background: white; color: #333; padding: 2px 4px; border: 1px solid #ccc; border-radius: 4px; z-index: 20;">
      EMA
    </div>
  </div>
</div>

<script>
(function() {
  const container = document.getElementById('dino-arch-container');
  const svg = document.getElementById('dino-connections');
  const area = document.getElementById('dino-diagram-area');
  if (!container || !svg || !area) return;

  const colors = { blue: '#1A73E8', tangerine: '#FA903E', red: '#D93025', outline: '#C4C7C5', text: '#575B5F' };

  function getElementCenter(id) {
    const el = container.querySelector('#' + id);
    if (!el) return { x: 0, y: 0, width: 0, height: 0, left: 0, right: 0, top: 0, bottom: 0 };
    const rect = el.getBoundingClientRect();
    const containerRect = svg.getBoundingClientRect();
    return {
      x: rect.left - containerRect.left + rect.width / 2,
      y: rect.top - containerRect.top + rect.height / 2,
      width: rect.width,
      height: rect.height,
      left: rect.left - containerRect.left,
      right: rect.left - containerRect.left + rect.width,
      top: rect.top - containerRect.top,
      bottom: rect.top - containerRect.top + rect.height
    };
  }

  function createPath(id, startId, endId, type, color) {
    const start = getElementCenter(startId);
    const end = getElementCenter(endId);
    let path = svg.querySelector('#' + id);
    let d = '';
    if (type === 'ema') {
      d = `M ${start.x} ${start.bottom} L ${end.x} ${end.top}`;
    } else if (startId === 'node-input') {
      const midX = (start.right + end.left) / 2;
      d = `M ${start.right} ${start.y} C ${midX} ${start.y}, ${midX} ${end.y}, ${end.left} ${end.y}`;
    } else if (endId === 'node-koleo' || endId === 'node-ibot') {
      d = `M ${start.right} ${start.y} C ${start.right + 40} ${start.y}, ${end.left - 40} ${end.y}, ${end.left} ${end.y}`;
    } else {
      d = `M ${start.right} ${start.y} L ${end.left} ${end.y}`;
    }
    if (!path) {
      path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('id', id);
      svg.appendChild(path);
    }
    path.setAttribute('d', d);
    path.style.fill = 'none';
    path.style.stroke = color || colors.outline;
    path.style.strokeWidth = '2';
    path.style.strokeLinecap = 'round';
    if (type === 'ema') {
      path.style.strokeDasharray = '6, 6';
    } else {
      path.setAttribute('marker-end', 'url(#dino-arrowhead)');
    }
  }

  function drawPaths() {
    createPath('p1', 'node-input', 'node-student', 'solid', null);
    createPath('p2', 'node-input', 'node-teacher', 'solid', null);
    createPath('p3', 'node-student', 'node-koleo', 'solid', null);
    createPath('p4', 'node-student', 'node-dino', 'solid', null);
    createPath('p5', 'node-teacher', 'node-dino', 'solid', null);
    createPath('p6', 'node-student', 'node-ibot', 'solid', null);
    createPath('p7', 'node-teacher', 'node-ibot', 'solid', null);
    createPath('p8', 'node-student', 'node-teacher', 'ema', colors.text);
  }

  let frame = 0;
  function spawnParticle(pathId, color, speed) {
    const path = svg.querySelector('#' + pathId);
    if (!path) return;
    const length = path.getTotalLength();
    if (!length) return;
    const particle = document.createElement('div');
    particle.style.cssText = `position:absolute;width:8px;height:8px;border-radius:50%;background:${color};pointer-events:none;z-index:5;`;
    area.appendChild(particle);
    let progress = 0;
    function move() {
      progress += speed;
      if (progress >= length) {
        particle.remove();
        return;
      }
      const pt = path.getPointAtLength(progress);
      particle.style.left = (pt.x - 4) + 'px';
      particle.style.top = (pt.y - 4) + 'px';
      requestAnimationFrame(move);
    }
    requestAnimationFrame(move);
  }

  function animate() {
    frame++;
    if (frame % 100 === 0) {
      spawnParticle('p1', colors.blue, 2);
      spawnParticle('p2', colors.blue, 2);
    }
    if (frame % 100 === 50) {
      spawnParticle('p3', colors.blue, 2);
      spawnParticle('p4', colors.blue, 2);
      spawnParticle('p6', colors.blue, 2);
      spawnParticle('p8', colors.text, 1);
      spawnParticle('p5', colors.tangerine, 2);
      spawnParticle('p7', colors.tangerine, 2);
    }
    requestAnimationFrame(animate);
  }

  setTimeout(() => { drawPaths(); animate(); }, 100);
  window.addEventListener('resize', drawPaths);
})();
</script>
