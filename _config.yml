# The Site Settings
theme: jekyll-theme-chirpy

lang: en

timezone: America/Los_Angeles

# Site identity
title: "Xiaozhi (Alan) Zhu"
tagline: "Applied Mathematician & AI Researcher"
description: >-
  Research notes and technical deep dives on Diffusion Models, 3D Generation,
  Self-Supervised Vision (DINO, SAM), Large Language Models, and Reinforcement Learning.

url: "https://zhuxiaozhi1994-seattle.github.io"

github:
  username: zhuxiaozhi1994-seattle

social:
  name: Xiaozhi (Alan) Zhu
  email: xiaozhizhu1994@gmail.com
  links:
    - https://github.com/zhuxiaozhi1994-seattle
    - https://scholar.google.com/citations?user=476oUoEAAAAJ

# Display preferences
theme_mode: # leave empty for auto with toggle

avatar: "/assets/images/photo.png"

toc: true

# Comments (Giscus)
comments:
  provider: giscus
  giscus:
    repo: xiaozhi-alan-zhu/xiaozhi-alan-zhu.github.io
    repo_id: R_kgDOP1cUIg
    category: General
    category_id: DIC_kwDOP1cUIs4Cv4rp
    mapping: pathname
    strict: 0
    input_position: bottom
    lang: en
    reactions_enabled: 1

# Analytics
analytics:
  google:
    id: # fill in GA measurement ID if desired

# Pagination
paginate: 10

# Build settings
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - "_legacy_jekyll"
  - "components"
  - "pages"
  - "public"
  - "scripts"
  - "styles"
  - "theme.config.tsx"
  - "train_bpe_tinystories.py"
  - "node_modules"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
